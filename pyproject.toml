[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowdark-bot"
version = "0.0.1"
description = "Discord bot for Shadow Dark TTRPG guild utilities"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    # Web app / Discord Activity (only started when WEB_ENABLED=true)
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
